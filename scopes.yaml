# Conventional Commit scope -> node id. A scope may map to a parent; path
# matching then refines to the child. null means not yet mapped: its PRs go to
# triage unless their paths match a node. Seeded from upstream history at
# b8938864, ordered by commit count.
#
# browser, ui, settings, operations, navigation, keyboard, appearance, and icons
# stay null on purpose. Their PRs land in several areas, so any single target
# would capture PRs that belong elsewhere; path matching decides instead.
#
# fallback nodes own shared modules no feature owns. A PR maps to one only
# when its paths touch no other node.
fallback: [app/infrastructure]
ignore: [deps, release, e2e, ci, readme, test, triage, logging, style, arch]
scopes:
  browser: null
  preview: preview/preview-panel
  ui: null
  settings: null
  archives: operations/archives
  columns: browser/view-modes/columns
  operations: null
  tenxer: integration/10xer-mode
  search: browser/search
  chooser: integration/portal-file-chooser
  trash: operations/trash
  sidebar: browser/sidebar
  updates: app/updates
  navigation: null
  window: app/window
  portal: integration/portal-file-chooser
  theme: settings/themes
  keyboard: null
  selection: browser/selection
  rename: operations/rename
  appearance: null
  sandbox: preview/preview-panel/sandbox
  properties: browser/properties
  open-with: integration/open-with
  icons: null
  filter: browser/search/filter
  delete: operations/delete
  context-menu: browser/context-menu
  archive: operations/archives
  transfer: operations/clipboard
  startup: null
  preferences: settings/preferences
  list: browser/view-modes/list
  installer: app/packaging/installer
  desktop: null
  volumes: devices/volumes
  thumbnail: browser/thumbnails
  tabs: browser/tabs
  remote: remote/file-providers/network-locations
  drag: operations/drag-and-drop
  update: app/updates
  thumbnails: browser/thumbnails
  terminal: integration/open-with/terminal
  recent: browser/navigation/recent
