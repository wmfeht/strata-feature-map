name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --with pyyaml python -m unittest discover -s scripts
      - name: Index is current
        run: |
          scripts/featuremap.py index
          git diff --exit-code -- README.md index/
      - name: Check
        run: scripts/featuremap.py check
