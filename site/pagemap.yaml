# The page map: the only place the site's pages and their `##` sections are declared.
# People change this file; agents edit inside it. `featuremap.py index` generates
# src/SUMMARY.md from it, and `featuremap.py check` holds every page to it.
#
# path      Page path under site/src/.
# title     Navigation title and the page's `#` heading.
# nodes     Feature node ids the page describes. The page's front matter repeats them.
# sections  The page's `##` headings, in order.

